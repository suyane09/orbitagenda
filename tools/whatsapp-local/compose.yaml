# Isolated local pilot. No remote Vercel/Supabase connectivity.
# Dedicated Compose project; ports bound to loopback only.
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      SERVER_URL: http://localhost:8088
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?Defina a chave no arquivo .env local}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://orbit_evo:${POSTGRES_PASSWORD:?Defina o segredo no arquivo .env local}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: orbitagenda_whatsapp_pilot
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: orbitagenda_whatsapp_pilot
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CORS_ORIGIN: http://localhost:8088
      TELEMETRY_ENABLED: "false"
      LOG_BAILEYS: error
    volumes:
      - evo_sessions:/evolution/instances

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: orbit_evo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina o segredo no arquivo .env local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit_evo -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 25
    volumes:
      - evo_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evo_redis:/data

volumes:
  evo_sessions:
  evo_postgres:
  evo_redis:
