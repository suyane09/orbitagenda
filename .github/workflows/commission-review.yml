name: Commission review checks
on:
  push:
    branches:
      - main
      - 'feature/commission-2c-panel-review'
  pull_request:
    paths:
      - 'src/features/commissions/**'
      - 'src/features/finance/**'
      - 'src/features/reports/**'
      - 'src/features/team/**'
      - 'src/features/subscriptions/**'
      - 'supabase/functions/asaas-*/**'
      - 'src/features/platform/**'
      - 'src/features/establishments/**'
      - 'src/App.tsx'
      - 'src/components/ui/Icon.tsx'
      - 'src/lib/**'
      - 'README.md'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'src/components/layout/AppShell.tsx'
      - 'package*.json'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/commission-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Instalação isolada para testes E2E; não altera package.json ou lockfile.
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://smoke-tests.supabase.co
          VITE_SUPABASE_ANON_KEY: smoke_public_test_key_not_a_secret
          VITE_ASAAS_BILLING_ENABLED: 'false'
      - run: node scripts/browser-smoke.mjs
